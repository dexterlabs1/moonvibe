---
name: Build - Flatpak
permissions:
  contents: read

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install flatpak-builder
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo -E apt-get update
          # --no-install-recommends: the recommends set pulls ~123 packages
          # (99 MB incl. ffmpeg) and has blown the step timeout on slow mirrors
          sudo -E apt-get install -y --no-install-recommends -o Dpkg::Lock::Timeout=300 flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak
        timeout-minutes: 75
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo=repo builddir packaging/flatpak/io.github.dexterlabs1.Moonvibe.json

      - name: Create bundle
        run: |
          flatpak build-bundle repo moonvibe.flatpak io.github.dexterlabs1.Moonvibe
          ls -lh moonvibe.flatpak

      - name: Upload bundle
        uses: actions/upload-artifact@v6
        with:
          name: moonvibe-flatpak
          path: moonvibe.flatpak
          compression-level: 0
          if-no-files-found: error
